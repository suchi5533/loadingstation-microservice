spring:
  application:
    name: loadingstation

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/lumax
    username: postgres
    password: Ats123

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        globally_quoted_identifiers: true

  main:
    lazy-initialization: true
    allow-circular-references: true
    allow-bean-definition-overriding: true

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  batch:
    jdbc:
      initialize-schema: always

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: outfeed-consumer-group
      enable-auto-commit: true
      auto-commit-interval: 1000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use-type-mapper-for-key: true

    listener:
      missing-topics-fatal: false

    properties:
      auto.create.topics.enable: true

  cloud:
    loadbalancer:
      ribbon:
        enabled: false

  eureka:
    instance:
      prefer-ip-address: true
    client:
      fetch-registry: true
      register-with-eureka: true
      service-url:
        defaultZone: http://localhost:8761/eureka

plc:
  opc-ua:
    enabled: true
    server-url: "opc.tcp://192.168.103.24/4840"
    security-policy: "None"
    username: ""
    password: ""
    connection-timeout: 5000
    max-reconnect-attempts: 3
    reconnect-delay: 5000

    tags:
      - name: "Tag1"
        identifier: "ns=0;i=2253"
        dataType: "Object"
      - name: "Tag2"
        identifier: "ns=2;i=5001"
        dataType: "Object"
      - name: "PLC"
        identifier: "ns=3;s=PLC"
        dataType: "Object"

    telegrams:
      - name: "ProductionData"
        identifier: "ns=2;s=Telegram_Production"
        dataType: "ByteString"
        length: 100
        format: "Binary"
        isArray: true

      - name: "MachineStatus"
        identifier: "ns=2;s=Telegram_Status"
        dataType: "String"
        length: 50
        format: "ASCII"
        isArray: false

      - name: "ProcessValues"
        identifier: "ns=2;s=Telegram_Process"
        dataType: "ByteString"
        length: 200
        format: "Binary"
        isArray: true

  writer:
    enabled: false
    interval: 5000
    node-id: 'ns=3;s="Lumax WMS<>PLC"."STACKER_1_MISSION_PALLET_CODE"'

  kafka:
    loadingStationTrolleyHeight: LoadingStation_TrolleyHeight_Topic
    trolleyHeightInfeedStation: TrolleyHeight_InfeedStation_Topic

logging:
  level:
    com.ats.plc: DEBUG
    org.eclipse.milo: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  config: classpath:logback-spring.xml

server:
  port: 8085

resilience4j:
  retry:
    instances:

      fetchPalletPresentRetry:
        max-attempts: 3  # Total = 1 initial + 2 retries
        wait-duration: 2s  # Time between retries

      Retry:
        max-attempts: 3
        wait-duration: 3s

        retry-exceptions:
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        fail-after-max-attempts: true
        event-consumer-buffer-size: 50

    aspect:
      enable-automatic-retry: true

  circuitbreaker:
    instances:
      CircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

    aspect:
      enable-automatic-circuit-breaker: true

